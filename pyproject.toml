[project]
name = "stresstest"
version = "0.1.0"
description = "Simulation: how hidden confounding biases treatment selection models"
readme = "README.md"
authors = [
    { name = "Evelyn Chang", email = "evelyn68961@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "stochtree>=0.4.5",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
